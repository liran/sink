version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /benchmarks/lua
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # The workflow ref and suite_ref input must be updated together.
      - dependency-name: liran/sink-production-suite*
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
