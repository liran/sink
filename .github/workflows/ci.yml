name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability-gate:
    name: Sink reliability gate
    if: always()
    needs: [public-conformance, client-contract, test, mongodb, search, image, release-assets, quickstart]
    runs-on: ubuntu-latest
    steps:
      - name: Require every qualification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'to_entries | length > 0 and all(.[]; .value.result == "success")' <<< "$RESULTS"

  public-conformance:
    name: Public API conformance (OpenSearch ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.8'
            image: opensearchproject/opensearch:3.8.0@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509
          - version: '2.17'
            image: opensearchproject/opensearch:2.17.0@sha256:7b9517dff561f54456fad947f11820fa595a340fd1034fc63d57b77f724b3f8f
    steps:
      - name: Check out Sink candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out immutable public suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: liran/sink-production-suite
          path: qualification
          ref: 2fd748ea5d084ff08f3b85b3130a0974ef7a3335
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: qualification/go.mod
          cache-dependency-path: qualification/go.sum
      - name: Qualify public behavior, isolation and operation sequences
        env:
          SINK_SERVER_DIR: ${{ github.workspace }}
          SINK_CONFORMANCE_OPENSEARCH_IMAGE: ${{ matrix.image }}
          TMPDIR: ${{ runner.temp }}
        run: make -C qualification test-conformance
      - name: Upload public API qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-api-conformance-${{ matrix.version }}
          path: ${{ runner.temp }}/sink-conformance.*
          retention-days: 14

  client-contract:
    name: Go client protocol contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Go client ref
        id: client-ref
        env:
          CANDIDATE_REF: ${{ github.head_ref }}
        run: |
          ref=main
          if [[ -n "${CANDIDATE_REF}" ]] && git ls-remote --exit-code --heads https://github.com/liran/sink-go.git "refs/heads/${CANDIDATE_REF}" >/dev/null 2>&1; then
            ref="${CANDIDATE_REF}"
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out Go client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: liran/sink-go
          path: sink-go
          ref: ${{ steps.client-ref.outputs.ref }}

      - name: Verify protobuf compatibility
        run: |
          sed 's#github.com/liran/sink/gen/sink;sink#github.com/liran/sink-go/api/sink/v1;sinkv1#' \
            proto/sink/sink.proto | diff -u - sink-go/proto/sink/sink.proto

  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          gofmt -l . | tee /tmp/sink-gofmt.out
          test ! -s /tmp/sink-gofmt.out

      - name: Run race tests
        run: go test -race ./... -count=1

      - name: Fuzz mutation envelopes
        run: go test ./internal/queue -run='^$' -fuzz=FuzzMutationEnvelope -fuzztime=20s -parallel=2

      - name: Run vet
        run: go vet ./...

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -checks=all ./...

  mongodb:
    name: MongoDB ReplicaSet integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MongoDB integration tests
        run: bash scripts/test-mongodb-integration.sh

  search:
    name: ${{ matrix.backend }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - elasticsearch
          - opensearch
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run search integration tests
        run: bash scripts/test-search-integration.sh "${{ matrix.backend }}"

  image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-assets:
    name: Build release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test release-note rendering
        run: scripts/test-render-release-notes.sh

      - name: Build cross-platform archives
        run: scripts/build-release-binaries.sh ci dist

      - name: Verify archive set and checksums
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'sink_ci_*' | wc -l)" -eq 4
          test "$(wc -l < dist/checksums.txt)" -eq 4
          cd dist
          sha256sum --check checksums.txt

      - name: Run documented Lua test example
        run: |
          go run ./cmd/sink lua test \
            --script examples/lua-test/product.lua \
            --cases examples/lua-test/cases

  quickstart:
    name: Docker Compose quickstart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run end-to-end example
        run: bash examples/quickstart/run.sh

      - name: Print service logs after failure
        if: failure()
        run: docker compose --file examples/quickstart/compose.yaml logs --no-color || true

      - name: Stop example services
        if: always()
        run: docker compose --file examples/quickstart/compose.yaml down --volumes --remove-orphans
