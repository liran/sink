name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          gofmt -l . | tee /tmp/sink-gofmt.out
          test ! -s /tmp/sink-gofmt.out

      - name: Run race tests
        run: go test -race ./... -count=1

      - name: Run vet
        run: go vet ./...

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -checks=all ./...

  mongodb:
    name: MongoDB ReplicaSet integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MongoDB integration tests
        run: bash scripts/test-mongodb-integration.sh

  search:
    name: ${{ matrix.backend }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - elasticsearch
          - opensearch
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run search integration tests
        run: bash scripts/test-search-integration.sh "${{ matrix.backend }}"

  image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  quickstart:
    name: Docker Compose quickstart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run end-to-end example
        run: bash examples/quickstart/run.sh

      - name: Print service logs after failure
        if: failure()
        run: docker compose --file examples/quickstart/compose.yaml logs --no-color || true

      - name: Stop example services
        if: always()
        run: docker compose --file examples/quickstart/compose.yaml down --volumes --remove-orphans
