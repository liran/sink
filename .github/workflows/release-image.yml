name: Release artifacts

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  qualify:
    name: Public production qualification
    uses: liran/sink-production-suite/.github/workflows/release-qualification.yml@ddc815bba10f0c669236cc3338f586807babe0fd
    with:
      suite_ref: ddc815bba10f0c669236cc3338f586807babe0fd
      sink_ref: ${{ github.event.release.tag_name }}

  binaries:
    name: Attach standalone binaries
    needs:
      - qualify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: scripts/build-release-binaries.sh "${{ github.event.release.tag_name }}" dist

      - name: Verify Linux amd64 binary version
        run: |
          mkdir -p /tmp/sink-release-verify
          tar -C /tmp/sink-release-verify -xzf "dist/sink_${{ github.event.release.tag_name }}_linux_amd64.tar.gz"
          test "$(/tmp/sink-release-verify/sink version)" = "${{ github.event.release.tag_name }}"

      - name: Attach binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber

  publish:
    name: Publish multi-platform image
    needs:
      - qualify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  describe:
    name: Update release installation details
    needs:
      - binaries
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add tagged image and binary details to release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          image_tag="${RELEASE_TAG#v}"
          tagged_image="${REGISTRY}/${IMAGE_NAME}:${image_tag}"
          gh release view "${RELEASE_TAG}" --json body --jq .body > /tmp/sink-release-body.md
          scripts/render-release-notes.sh \
            /tmp/sink-release-body.md \
            /tmp/sink-release-body-updated.md \
            "${tagged_image}" \
            "${IMAGE_DIGEST}"
          gh release edit "${RELEASE_TAG}" --notes-file /tmp/sink-release-body-updated.md
