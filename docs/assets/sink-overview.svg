    <path d="M1230 385H1265V162.5M1265 385V562.5" stroke="#3e5a6c" stroke-width="3"/>
    <path d="M1265 162.5H1288M1265 362.5H1288M1265 562.5H1288" stroke="#3e5a6c" stroke-width="3"/>
    <path d="M595 277V290M595 384V397" stroke="#9fb3c0" stroke-width="2"/>
    <path d="M957.5 529V548" stroke="#0f6a63" stroke-width="2.5"/>
  </g>

