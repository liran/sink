  <rect x="35" y="752" width="1430" height="44" rx="3" fill="#132a3a"/>
  <text class="footer" x="750" y="779" text-anchor="middle">ONE RECORD CONTRACT   |   TWO DELIVERY MODES   |   ONE MATCHING STORE PER OPERATION</text>
</svg>
