<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">Sink architecture overview</title>
  <desc id="description">Applications send one gRPC record API to Sink. Sink routes and batches synchronous work to MongoDB, Elasticsearch, or OpenSearch, and can send asynchronous mutations through Kafka workers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="sink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { fill: #475569; font-size: 17px; font-weight: 700; letter-spacing: 1.5px; }
      .card-title { fill: #0f172a; font-size: 21px; font-weight: 700; }
      .card-copy { fill: #475569; font-size: 16px; }
      .sink-title { fill: #ffffff; font-size: 34px; font-weight: 800; }
      .sink-copy { fill: #dbeafe; font-size: 17px; }
      .pill { fill: #ffffff; font-size: 15px; font-weight: 700; }
      .label { fill: #334155; font-size: 14px; font-weight: 700; }
      .footer-title { fill: #1e3a8a; font-size: 18px; font-weight: 800; }
      .footer-copy { fill: #334155; font-size: 16px; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#background)"/>

  <text class="section" x="70" y="60">YOUR APPLICATIONS</text>
  <text class="section" x="465" y="60">SINK</text>
  <text class="section" x="900" y="60">INFRASTRUCTURE</text>

  <g filter="url(#shadow)">
    <rect x="70" y="100" width="275" height="92" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="108" cy="146" r="18" fill="#dbeafe"/>
    <path d="M100 146h16M108 138v16" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <text class="card-title" x="140" y="139">API services</text>
    <text class="card-copy" x="140" y="166">simple record calls</text>

    <rect x="70" y="220" width="275" height="92" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="108" cy="266" r="18" fill="#dcfce7"/>
    <path d="M99 270l7-7 5 5 7-9" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card-title" x="140" y="259">Crawler workers</text>
    <text class="card-copy" x="140" y="286">high concurrency</text>

    <rect x="70" y="340" width="275" height="92" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="108" cy="386" r="18" fill="#fef3c7"/>
    <path d="M98 386h20M101 380h14M104 374h8M104 392h8M101 398h14" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <text class="card-title" x="140" y="379">Data pipelines</text>
    <text class="card-copy" x="140" y="406">batch ingestion</text>
  </g>

  <path d="M345 266 C385 266 395 266 430 266" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <rect x="351" y="228" width="74" height="26" rx="13" fill="#dbeafe"/>
  <text class="label" x="388" y="246" text-anchor="middle">gRPC</text>

  <g filter="url(#shadow)">
    <rect x="440" y="92" width="350" height="348" rx="24" fill="url(#sink)"/>
  </g>
  <text class="sink-title" x="615" y="146" text-anchor="middle">Sink</text>
  <text class="sink-copy" x="615" y="176" text-anchor="middle">one JSON record contract</text>

  <rect x="482" y="207" width="266" height="48" rx="12" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.3"/>
  <text class="pill" x="615" y="237" text-anchor="middle">Address-based routing</text>

  <rect x="482" y="271" width="266" height="48" rx="12" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.3"/>
  <text class="pill" x="615" y="301" text-anchor="middle">Bounded batching + concurrency</text>

  <rect x="482" y="335" width="266" height="48" rx="12" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.3"/>
  <text class="pill" x="615" y="365" text-anchor="middle">Ordering + atomic Lua merge</text>

  <text class="sink-copy" x="615" y="414" text-anchor="middle">health • metrics • backpressure</text>

  <path d="M790 176 C835 176 838 142 880 142" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text class="label" x="832" y="135" text-anchor="middle">sync</text>

  <g filter="url(#shadow)">
    <rect x="890" y="92" width="240" height="100" rx="16" fill="#ffffff" stroke="#93c5fd"/>
    <ellipse cx="930" cy="124" rx="21" ry="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M909 124v25c0 4 9 8 21 8s21-4 21-8v-25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M909 137c0 4 9 8 21 8s21-4 21-8" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text class="card-title" x="968" y="132">MongoDB</text>
    <text class="card-copy" x="968" y="158">one or many clusters</text>

    <rect x="890" y="216" width="240" height="100" rx="16" fill="#ffffff" stroke="#a5b4fc"/>
    <rect x="910" y="240" width="40" height="40" rx="8" fill="#e0e7ff"/>
    <path d="M921 250h18M921 260h18M921 270h13" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
    <text class="card-title" x="968" y="256">Elasticsearch</text>
    <text class="card-copy" x="968" y="282">existing indexes</text>

    <rect x="890" y="340" width="240" height="100" rx="16" fill="#ffffff" stroke="#c4b5fd"/>
    <circle cx="930" cy="390" r="22" fill="#ede9fe"/>
    <path d="M919 391l7 7 15-17" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card-title" x="968" y="380">OpenSearch</text>
    <text class="card-copy" x="968" y="406">existing indexes</text>
  </g>

  <path d="M790 388 C830 388 832 491 875 491" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-violet)"/>
  <text class="label" x="826" y="458" text-anchor="middle">async</text>

  <g filter="url(#shadow)">
    <rect x="890" y="466" width="240" height="74" rx="16" fill="#ffffff" stroke="#c4b5fd"/>
    <circle cx="929" cy="503" r="19" fill="#ede9fe"/>
    <path d="M920 496h18M920 503h18M920 510h18" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
    <text class="card-title" x="962" y="498">Kafka + worker</text>
    <text class="card-copy" x="962" y="522">optional per store</text>
  </g>

  <path d="M1130 503 H1154 V142" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <path d="M1154 142 H1138" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <path d="M1154 266 H1138" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <path d="M1154 390 H1138" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-violet)"/>

  <rect x="70" y="566" width="1060" height="48" rx="16" fill="#dbeafe"/>
  <text class="footer-title" x="96" y="596">Application code stays simple.</text>
  <text class="footer-copy" x="350" y="596">Sink owns storage adaptation, bounded throughput, delivery choices, and operational signals.</text>
</svg>
