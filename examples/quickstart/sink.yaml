mode: all

grpc:
  address: ":8080"
  max_receive_message_bytes: 67108864
  max_send_message_bytes: 67108864

prometheus:
  address: ":9090"

storages:
  - name: primary
    driver: mongodb
    mongodb:
      uri: mongodb://mongo:27017/?replicaSet=rs0
      max_concurrent_writes: 64
      max_concurrent_groups: 16

service:
  max_operations: 1000
  max_merge_attempts: 3
  batching:
    enabled: true
    max_wait_milliseconds: 2
    max_operations: 1000
    max_bytes: 16777216
    max_queued_operations: 10000
    max_queued_bytes: 134217728
  lua:
    timeout_milliseconds: 100
    max_source_bytes: 65536
    max_result_bytes: 16777216
    max_cached_programs: 256
    max_instructions: 1000000

kafka:
  brokers:
    - kafka:19092
  topic: sink-mutations
  group_id: sink-quickstart
  dead_letter_topic: sink-mutations.dlq
  max_poll_records: 500
  max_retry_attempts: 10
  retry_backoff_milliseconds: 100
  max_retry_backoff_milliseconds: 10000

shutdown_timeout_seconds: 15
